services:
  support:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PROJECT_ROOT: /project
      SUPPORT_DATA_DIR: /data
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ${PROJECT_PATH:?Set PROJECT_PATH}:/project:ro
      - ./data:/data:ro
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
